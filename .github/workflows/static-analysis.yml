name: Static Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    name: PHPStan + Psalm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run static analysis
        run: composer sa
