name: Coding Standards

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  coding-standards:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run coding standards check
        run: composer cs
